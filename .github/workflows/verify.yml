name: Simulation verification
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    if: ${{ github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: drone_test
          POSTGRES_USER: drone_test
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drone_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - name: Install locked tooling without application credentials
        run: |
          python -m venv .venv311
          .venv311/bin/python -m pip install -r backend/requirements.lock
          npm --prefix frontend ci --ignore-scripts
      - name: Backend, hygiene and contracts
        run: |
          .venv311/bin/python -m ruff check backend autonomy simulation integrations scripts tests
          .venv311/bin/python -m pytest -q
          .venv311/bin/python -m unittest discover -s scripts/release -p 'test_*.py'
          .venv311/bin/python scripts/repository_hygiene.py --history
      - name: PostgreSQL integration
        env:
          DRONE_TEST_DATABASE_URL: postgresql+psycopg://drone_test:synthetic-test-only@127.0.0.1:5432/drone_test
        run: .venv311/bin/python -m pytest -q
      - name: Build and scan dependencies
        run: |
          node --test scripts/test_vercel_package.mjs
          node --test scripts/release/vercel_transport_guard.test.cjs
          node --test scripts/release/probe_policy.test.mjs
          node --test scripts/release/oracle_drone_identity_browser.test.mjs
          node --check scripts/release/hosted_probe.mjs
          npm --prefix frontend run test:unit
          npm --prefix frontend run build
          npm --prefix frontend audit --audit-level=high
          .venv311/bin/python -m pip_audit -r backend/requirements.lock --no-deps --disable-pip
      - name: 'Release requirement: Verify built frontend package'
        run: node scripts/check_frontend_release_package.mjs
      - name: Check the Ubuntu archive mirror for Chromium prerequisites
        run: bash .github/scripts/browser-apt-mirror.sh
      - name: Browser acceptance
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Runtime container security gate
        run: |
          python scripts/pull_ci_scanner.py
          docker build --file infrastructure/Dockerfile --build-arg DRONE_SOURCE_COMMIT="$GITHUB_SHA" --tag onesa-drone:ci .
          docker image save onesa-drone:ci --output "$RUNNER_TEMP/drone-runtime.tar"
          docker run --rm --memory 1g --cpus 1 --volume "$RUNNER_TEMP/drone-runtime.tar:/scan/runtime.tar:ro" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input /scan/runtime.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --quiet
      - name: Create credential-free component manifests
        run: .venv311/bin/python -m scripts.ci_manifests --output "$RUNNER_TEMP/drone-runtime-manifests" --image onesa-drone:ci --image-archive "$RUNNER_TEMP/drone-runtime.tar"
      - name: 'Release requirement: Publish backend provenance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-onesa-drone-backend
          path: ${{ runner.temp }}/drone-runtime-manifests/backend.json
          retention-days: 1
          if-no-files-found: error
      - name: 'Release requirement: Publish frontend provenance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-onesa-drone-frontend
          path: ${{ runner.temp }}/drone-runtime-manifests/frontend.json
          retention-days: 1
          if-no-files-found: error
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - name: 'Release requirement: Bundle mobile app and test simulation-only mission contract'
        run: |
          cd frontend/drone/mobile
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install expo install --check
          npm test
          npx --no-install expo export --platform all --output-dir "$RUNNER_TEMP/onesa-drone-mobile-bundles"
          npx --no-install expo prebuild --platform android --no-install
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const c=JSON.parse(readFileSync('app.json')); if(c.expo.extra.hardwareFlightEnabled!==false||c.expo.extra.simulationOnly!==true)process.exit(1);"
  mobile-android:
    needs: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Verify hosted execution, visibility and included-allowance policy
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRIVATE: ${{ github.event.repository.private }}
          PRIVATE_VALIDATION_ENABLED: ${{ vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ".private")
          test "$actual" = "$EXPECTED_PRIVATE" || { echo "Repository visibility changed"; exit 1; }
          if [ "$actual" = true ] && [ "$PRIVATE_VALIDATION_ENABLED" != true ]; then
            echo "Private hosted verification requires explicit included-allowance opt-in"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/drone/mobile/package-lock.json
      - name: Install locked mobile dependencies
        working-directory: frontend/drone/mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Android sources from the locked local Expo template
        run: python3 -m scripts.mobile_native_compile prepare --platform android --output "$RUNNER_TEMP/drone-native-android"
      - name: Select the reviewed JDK and Android SDK versions
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          # The published API 37.0 platform needs RN's integer compileSdk alias.
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: 'Release requirement: Compile arm64 Android debug application'
        working-directory: frontend/drone/mobile
        run: |
          for attempt in 1 2 3; do
            build_log="$RUNNER_TEMP/drone-android-build-$attempt.log"
            set +e
            ./android/gradlew -p android :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain 2>&1 | tee "$build_log"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              exit 0
            fi
            # Retry only observed dependency download failures within this bounded job.
            # Compilation and test errors retain their original nonzero status.
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Received status code (502|503|504)|Server returned HTTP response code: (502|503|504)|Downloading from https://.*failed: timeout|java\.net\.SocketTimeoutException' "$build_log"; then
              exit "$build_status"
            fi
            echo "Transient dependency download failure; retrying Android build ($attempt/3)."
            sleep "$((10 * attempt))"
          done
      - name: 'Release requirement: Qualify Android native output and source proof'
        run: python3 -m scripts.mobile_native_compile qualify --platform android --output "$RUNNER_TEMP/drone-native-android"
      - name: 'Release requirement: Retain Android native compile evidence'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-android-native-compile
          path: |
            ${{ runner.temp }}/drone-native-android/compile-proof.json
            ${{ runner.temp }}/drone-native-android/OnesaDrone-arm64-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          compression-level: 6
  mobile-ios:
    needs: mobile
    runs-on: macos-26
    timeout-minutes: 50
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Verify hosted execution, visibility and included-allowance policy
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRIVATE: ${{ github.event.repository.private }}
          PRIVATE_VALIDATION_ENABLED: ${{ vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ".private")
          test "$actual" = "$EXPECTED_PRIVATE" || { echo "Repository visibility changed"; exit 1; }
          if [ "$actual" = true ] && [ "$PRIVATE_VALIDATION_ENABLED" != true ]; then
            echo "Private hosted verification requires explicit included-allowance opt-in"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/drone/mobile/package-lock.json
      - name: Install locked mobile dependencies
        working-directory: frontend/drone/mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate iOS sources from the locked local Expo template
        run: python3 -m scripts.mobile_native_compile prepare --platform ios --output "$RUNNER_TEMP/drone-native-ios"
      - name: Record native toolchain and resolve local module pods
        working-directory: frontend/drone/mobile
        run: |
          xcodebuild -version
          pod --version
          "$GITHUB_WORKSPACE/scripts/ios-simulator-ui/run.sh" prepare
      - name: 'Release requirement: Compile arm64 iOS simulator without distribution signing'
        working-directory: frontend/drone/mobile
        run: >-
          xcodebuild -workspace ios/OnesaDrone.xcworkspace -scheme OnesaDrone
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .validation/ios-build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO build
      - name: 'Release requirement: Qualify iOS native output and source proof'
        run: python3 -m scripts.mobile_native_compile qualify --platform ios --output "$RUNNER_TEMP/drone-native-ios"
      - name: Exercise the planner and encrypted draft on a fresh iPhone Simulator
        run: scripts/ios-simulator-ui/run.sh test
      - name: 'Release requirement: Retain iOS native compile evidence'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-ios-native-compile
          path: |
            frontend/drone/mobile/.validation/simulator-ui.xcresult.summary.json
            ${{ runner.temp }}/drone-native-ios/compile-proof.json
            ${{ runner.temp }}/drone-native-ios/OnesaDrone-arm64-simulator.tar.gz
            ${{ runner.temp }}/drone-native-ios/Podfile.lock
            ${{ runner.temp }}/drone-native-ios/swiftpm-*-Package.resolved
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          compression-level: 0
