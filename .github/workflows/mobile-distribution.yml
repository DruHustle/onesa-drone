name: Verify Android distribution procedure
on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - "scripts/mobile_android_distribution.py"
      - "scripts/android_planner_smoke.py"
      - "tests/test_mobile_android_distribution.py"
      - "frontend/drone/mobile/**"
      - "scripts/mobile_native_compile.py"
      - ".github/workflows/mobile-distribution.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-procedure:
    if: ${{ github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/drone/mobile/package-lock.json
      - name: Prepare reviewed toolchain
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
          npm --prefix frontend/drone/mobile ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the disposable Android 15 emulator
        run: |
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
      - name: Build and sign with a discarded test identity, then verify
        env:
          FIXTURE_PASSWORD: local-distribution-procedure-only
        run: |
          set -euo pipefail
          umask 077
          out="$RUNNER_TEMP/drone-install-fixture"
          trap 'rm -rf -- "$out"' EXIT
          npm --prefix frontend/drone/mobile test
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error --retry 3 -o "$bundletool" \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar'
          python -m scripts.mobile_android_distribution build --directory "$out" --bundletool "$bundletool"
          keytool -genkeypair -keystore "$out/fixture.p12" -storetype PKCS12 \
            -storepass:env FIXTURE_PASSWORD -alias fixture -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=Disposable CI Fixture'
          cert=$(keytool -exportcert -keystore "$out/fixture.p12" -storepass:env FIXTURE_PASSWORD -alias fixture | sha256sum | cut -d' ' -f1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$out/fixture.p12" --ks-key-alias fixture \
            --ks-pass env:FIXTURE_PASSWORD --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$out/fixture.apk" "$out/aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$out/fixture.apk" |
            grep -E '^Verified using|^Number of signers| certificate (DN|SHA-256 digest)'
          version=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["versionName"])' "$out/unsigned-receipt.json")
          python -m scripts.mobile_android_distribution verify --directory "$out" --apk "$out/fixture.apk" \
            --certificate-sha256 "$cert" --url "https://drone.onesa.eu/downloads/onesa-drone-android-v$version.apk" > "$out/receipt.json"
          test -s "$out/receipt.json"
          keytool -exportcert -rfc -keystore "$out/fixture.p12" -storepass:env FIXTURE_PASSWORD \
            -alias fixture -file "$out/fixture.pem"
          jarsigner -keystore "$out/fixture.p12" -storepass:env FIXTURE_PASSWORD \
            -signedjar "$out/fixture.aab" "$out/OnesaDrone-unsigned.aab" fixture
          python -m scripts.mobile_android_distribution verify-play --directory "$out" \
            --aab "$out/fixture.aab" --upload-certificate "$out/fixture.pem" > "$out/play-qualified.json"
          python - "$out/play-qualified.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as stream:
              r = json.load(stream)
          text = (f"{r['package']} {r['versionName']} ({r['versionCode']}), API {r['minSdk']}–{r['targetSdk']}, "
                  f"{', '.join(r['architectures'])}, {r['nativeLibrariesVerified']} native libraries, "
                  f"{r['minElfPageBytes']} byte ELF / {r['nativeZipAlignment']}, disposable signature verified")
          print("::notice title=Qualified Android release AAB::" + text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("### Release AAB\n\n" + text + "\n\nSource `" + r["sourceCommit"] + "`\n")
          PY
          printf '%s\n' "$FIXTURE_PASSWORD" > "$out/fixture-password"
          java -jar "$bundletool" build-apks --bundle="$out/fixture.aab" --output="$out/fixture.apks" \
            --mode=universal --ks="$out/fixture.p12" --ks-key-alias=fixture \
            --ks-pass="file:$out/fixture-password" --key-pass="file:$out/fixture-password"
          unzip -p "$out/fixture.apks" universal.apk > "$RUNNER_TEMP/offline-planner-fixture.apk"
      - name: Exercise the verified store bundle on the offline Android 15 emulator
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/offline-planner-fixture.apk"
          trap 'rm -f -- "$apk"' EXIT
          timeout 15m python -u -m scripts.android_planner_smoke "$apk" --screenshots "$RUNNER_TEMP/offline-planner-images"
      - name: Preserve only signed-out synthetic planner images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-offline-planner-screenshots
          path: |
            ${{ runner.temp }}/offline-planner-images/01-offline-planner.png
            ${{ runner.temp }}/offline-planner-images/02-completed-synthetic-replay.png
            ${{ runner.temp }}/offline-planner-images/03-hardware-video-unavailable.png
          if-no-files-found: warn
          retention-days: 7
