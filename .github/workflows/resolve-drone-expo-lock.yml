name: Compare locked Expo native templates
on:
  push:
    branches: [ci/resolve-drone-expo-lock-20261112]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Compare locked package templates and identify remaining source pins
        run: |
          git grep -l -F '58.0.24' -- ':!.github/workflows/resolve-drone-expo-lock.yml'
          cd frontend/drone/mobile
          npm ci --ignore-scripts --no-audit --no-fund
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent expo@58.0.24
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent expo@58.0.25
          cd ../../..
          python3 - <<'PY'
          import base64, hashlib, io, json, os, tarfile
          from pathlib import Path
          mobile = Path("frontend/drone/mobile")
          work = Path(os.environ["RUNNER_TEMP"])
          expected = ["sha512-EPgijeqjnK+eaoA9VzJvvodmKBxEcfNlRBxyZr5s1dmvjgF13p3HfEr6eRjsTtnXdz/GlKn2uffTM1uHZeaSVQ==", json.loads((mobile/"package-lock.json").read_text())["packages"]["node_modules/expo"]["integrity"]]
          def template(version, integrity):
              raw = (work / ("expo-" + version + ".tgz")).read_bytes()
              assert "sha512-" + base64.b64encode(hashlib.sha512(raw).digest()).decode() == integrity
              with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as archive:
                  data = archive.extractfile("package/template.tgz").read()
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
                  contents = {x.name: (x.type.decode(), x.mode, x.linkname, hashlib.sha256(archive.extractfile(x).read()).hexdigest() if x.isfile() else None) for x in archive.getmembers()}
              return data, contents
          old, a = template("58.0.24", expected[0])
          new, b = template("58.0.25", expected[1])
          assert new == (mobile/"node_modules/expo/template.tgz").read_bytes()
          assert hashlib.sha256(old).hexdigest() == "2f2a42ae5c987161390221d8071a218bd85652284d06207c4a227ffb867b63a5"
          changed = sorted(k for k in a.keys() | b.keys() if a.get(k) != b.get(k))
          print("ONESA_TEMPLATE_COMPARISON",json.dumps({"old":hashlib.sha256(old).hexdigest(),"new":hashlib.sha256(new).hexdigest(),"oldEntries":len(a),"newEntries":len(b),"changed":changed}))
          for name in changed:
              if name not in ["package/package.json","package/app.json"]: continue
              with tarfile.open(fileobj=io.BytesIO(old),mode="r:gz") as arc: before=json.loads(arc.extractfile(name).read())
              with tarfile.open(fileobj=io.BytesIO(new),mode="r:gz") as arc: after=json.loads(arc.extractfile(name).read())
              for k in before.keys() | after.keys():
                  if before.get(k)!=after.get(k): print("ONESA_TEMPLATE_FIELD",name,k,json.dumps(before.get(k)),json.dumps(after.get(k)))
          PY
