name: Resolve Drone Expo lockfiles
on:
  pull_request:
    paths:
      - .github/workflows/resolve-expo-lock.yml
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'readiness/resolve-expo-lock-20261123' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Resolve and qualify the published SDK packages
        working-directory: frontend/drone/mobile
        run: |
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund expo@58.0.26 expo-web-browser@58.1.0
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install expo install --check
          npm test
          git --no-pager diff -- package.json package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drone-expo-lockfiles
          path: |
            frontend/drone/mobile/package.json
            frontend/drone/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
