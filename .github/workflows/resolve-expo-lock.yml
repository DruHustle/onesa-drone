name: Verify Drone Expo template
on:
  pull_request:
    paths:
      - .github/workflows/resolve-expo-lock.yml
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'readiness/resolve-expo-lock-20261123' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Verify the lockfile and record native template digests
        working-directory: frontend/drone/mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install expo install --check
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          package = Path("node_modules/expo")
          assert json.loads((package / "package.json").read_text())["version"] == "58.0.26"
          archive = package / "template.tgz"
          assert archive.stat().st_size <= 1024 * 1024
          print("EXPO_TEMPLATE_SHA256 " + hashlib.sha256(archive.read_bytes()).hexdigest())
          expected = (
              "package/android/app/build.gradle",
              "package/android/app/debug.keystore",
              "package/android/build.gradle",
              "package/android/gradle/wrapper/gradle-wrapper.properties",
              "package/ios/Podfile",
          )
          with tarfile.open(archive, mode="r:gz") as bundle:
              for name in expected:
                  member = bundle.getmember(name)
                  assert member.isfile() and 0 < member.size <= 512 * 1024
                  with bundle.extractfile(member) as entry:
                      print(name + " " + hashlib.sha256(entry.read()).hexdigest())
          PY
