name: Repository hygiene
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
permissions:
  contents: read
jobs:
  publication-hygiene:
    if: ${{ github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Check complete available repository history
        run: python scripts/repository_hygiene.py --history
